[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[project]
name = "pypARTn"
dynamic = ["version"]
description = "Open-ended exploration of saddle points on PES"
authors = [{name = "MAMMASMIAS Consortium"}]
urls = {Homepage = "https://gitlab.com/mammasmias/artn-plugin"}
license = {text = "GPL-3.0-or-later OR Apache-2.0"}
dependencies = ["numpy>=2.2.6"]

[tool.scikit-build]
cmake.version = ">=3.21"
wheel.packages = []  # Python files are installed via cmake install()

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/artn_version.h"
regex = '#define ARTN_VERSION "(?P<value>[^"]+)"'
