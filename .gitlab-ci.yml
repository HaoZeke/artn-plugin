image: alpine

test:
  stage: test
  script:
  - apk add gcc
  - apk add python3
  - python3 -m venv .venv
  - . .venv/bin/activate
  - apk add doxygen
  - python3 -m pip install numpy
  - python3 -m pip install six
  - python3 -m pip install sphinx
  - python3 -m pip install sphinx-rtd-theme
  - python3 -m pip install sphinx-sitemap
  - python3 -m pip install breathe
  - python3 -m pip install sphinx-fortran
  - sphinx-build -b html docs public
  rules:
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
    
pages:
  stage: deploy
  script:
  - apk add gcc
  - apk add python3
  - python3 -m venv .venv
  - . .venv/bin/activate
  - apk add doxygen
  - python3 -m pip install numpy
  - python3 -m pip install six
  - python3 -m pip install sphinx
  - python3 -m pip install sphinx-rtd-theme
  - python3 -m pip install sphinx-sitemap
  - python3 -m pip install breathe
  - python3 -m pip install sphinx-fortran
  - sphinx-build -b html docs public
  artifacts:
    paths:
    - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH


